# Gate the edge-hosted service on the in-cluster client's ServiceAccount identity.
#
# CONFIRM LIVE: a Server targeting an ExternalWorkload uses an external-workload
# selector, not podSelector. Verify the exact field before applying:
#   kubectl explain server.spec
# and adjust `externalWorkloadSelector` below if the current CRD names it differently.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  namespace: mixed-env
  name: edge-echo-http
spec:
  externalWorkloadSelector:
    matchLabels: { app: edge-echo }
  port: http
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  namespace: mixed-env
  name: allow-client-sa
spec:
  identities:
    - "default.mixed-env.serviceaccount.identity.linkerd.cluster.local"
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  namespace: mixed-env
  name: edge-allow-client
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: edge-echo-http
  requiredAuthenticationRefs:
    - name: allow-client-sa
      kind: MeshTLSAuthentication
      group: policy.linkerd.io
