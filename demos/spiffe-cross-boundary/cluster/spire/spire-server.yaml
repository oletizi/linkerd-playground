apiVersion: v1
kind: Namespace
metadata:
  name: spire
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: spire
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: spire
spec:
  replicas: 1
  serviceName: spire-server
  selector:
    matchLabels: { app: spire-server }
  template:
    metadata:
      labels: { app: spire-server }
    spec:
      serviceAccountName: spire-server
      automountServiceAccountToken: false
      containers:
        - name: spire-server
          image: ghcr.io/spiffe/spire-server:1.11.2
          args: ["-config", "/run/spire/conf/server.cfg"]
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: conf
              mountPath: /run/spire/conf
              readOnly: true
            - name: upstream-ca
              mountPath: /run/spire/secret
              readOnly: true
            - name: data
              mountPath: /run/spire/data
      volumes:
        - name: conf
          configMap: { name: spire-server-config }
        - name: upstream-ca
          secret: { secretName: spire-upstream-ca }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: spire
spec:
  type: NodePort
  selector: { app: spire-server }
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
      nodePort: 30081
