apiVersion: v1
kind: Namespace
metadata:
  name: mixed-env
  annotations:
    linkerd.io/inject: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: mixed-env
  labels: { app: echo }
spec:
  replicas: 1
  selector: { matchLabels: { app: echo } }
  template:
    metadata:
      labels: { app: echo }
    spec:
      containers:
        - name: echo
          image: ealen/echo-server:latest
          ports: [{ containerPort: 80, name: http }]
          env: [{ name: PORT, value: "80" }]
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: mixed-env
spec:
  selector: { app: echo }
  ports: [{ port: 80, targetPort: 80, name: http }]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: mixed-env
  labels: { app: client }
spec:
  containers:
    - name: client
      image: curlimages/curl:latest
      command: ["sleep", "infinity"]
