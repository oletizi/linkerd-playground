apiVersion: v1
kind: ServiceAccount
metadata:
  name: retail-cloud
  namespace: mixed-env
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: retail-cloud-policy
  namespace: mixed-env
rules:
  - apiGroups: ["policy.linkerd.io"]
    resources: ["meshtlsauthentications"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: retail-cloud-policy
  namespace: mixed-env
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: retail-cloud-policy
subjects:
  - kind: ServiceAccount
    name: retail-cloud
    namespace: mixed-env
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-cloud
  namespace: mixed-env
  labels: { app: retail-cloud }
spec:
  replicas: 1
  selector: { matchLabels: { app: retail-cloud } }
  template:
    metadata:
      labels: { app: retail-cloud }
    spec:
      serviceAccountName: retail-cloud
      containers:
        - name: web
          image: node:20-alpine
          command: ["node", "/app/server.js"]
          env:
            - { name: PORT, value: "8080" }
            - { name: INGEST_PORT, value: "8090" }
            - { name: DEMO_NS, value: "mixed-env" }
            - { name: AUTHN_NAME, value: "allow-store" }
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 8090, name: ingest }
          volumeMounts:
            - { name: app, mountPath: /app }
      volumes:
        - name: app
          configMap: { name: retail-cloud-app }
---
apiVersion: v1
kind: Service
metadata:
  name: retail-cloud
  namespace: mixed-env
spec:
  type: NodePort
  selector: { app: retail-cloud }
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 8090
      targetPort: 8090
      name: ingest
