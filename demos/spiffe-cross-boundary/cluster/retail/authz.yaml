# Protects the on-prem store-pos service: default-deny on its HTTP port, allowing
# only the retail-cloud app's identity. The "Void" button patches the identities
# below to a different value, which denies the cloud app for real.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  namespace: mixed-env
  name: store-pos-http
spec:
  externalWorkloadSelector:
    matchLabels: { app: store-pos }
  port: http
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  namespace: mixed-env
  name: allow-retail-cloud
spec:
  identities:
    - "retail-cloud.mixed-env.serviceaccount.identity.linkerd.cluster.local"
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  namespace: mixed-env
  name: store-pos-allow-cloud
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: store-pos-http
  requiredAuthenticationRefs:
    - name: allow-retail-cloud
      kind: MeshTLSAuthentication
      group: policy.linkerd.io
