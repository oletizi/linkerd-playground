# Protects the cloud's ingest port: default-deny on retail-cloud's :8090, allowing
# only the STORE's SPIFFE identity to push. The browser-facing UI port (:8080) has
# no Server, so it stays open. The "Void" button patches the identities below to a
# different value, which refuses the store's pushes for real.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  namespace: mixed-env
  name: retail-ingest
spec:
  podSelector:
    matchLabels: { app: retail-cloud }
  port: ingest
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  namespace: mixed-env
  name: allow-store
spec:
  identities:
    - "spiffe://root.linkerd.cluster.local/store-pos"
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  namespace: mixed-env
  name: ingest-allow-store
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: retail-ingest
  requiredAuthenticationRefs:
    - name: allow-store
      kind: MeshTLSAuthentication
      group: policy.linkerd.io
