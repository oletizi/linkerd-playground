apiVersion: workload.linkerd.io/v1beta1
kind: ExternalWorkload
metadata:
  name: store-pos
  namespace: mixed-env
  labels:
    location: on-prem
    app: store-pos
    workload_name: store-pos
spec:
  meshTLS:
    identity: "spiffe://root.linkerd.cluster.local/store-pos"
    serverName: "store-pos.cluster.local"
  workloadIPs:
  - ip: "__EDGE_ADDR__"
  ports:
  - port: 80
    name: http
# No fronting Service: the store is a client that pushes to the cloud, not a
# server the cluster routes to. The ExternalWorkload above still gives it a
# first-class mesh identity so the cloud can authorize its pushes.
