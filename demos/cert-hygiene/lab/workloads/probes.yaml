apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-http
  namespace: ${LAB_NS}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-http
  template:
    metadata:
      labels:
        app: probe-http
    spec:
      containers:
        - name: probe
          image: ${IMAGE_CURL}
          command: ["sh", "/probes/probe-http.sh"]
          env:
            - name: TARGET_URL
              value: http://server.${LAB_NS}.svc.cluster.local:8080/
            - name: PROBE_INTERVAL_S
              value: "${PROBE_INTERVAL_S}"
          volumeMounts:
            - name: probes
              mountPath: /probes
      volumes:
        - name: probes
          configMap:
            name: lab-probes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-tcp-new
  namespace: ${LAB_NS}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-tcp-new
  template:
    metadata:
      labels:
        app: probe-tcp-new
    spec:
      containers:
        - name: probe
          image: ${IMAGE_SOCAT}
          command: ["sh", "/probes/probe-tcp-new.sh"]
          env:
            - name: PROBE_NAME
              value: probe-tcp-new
            - name: TARGET_HOST
              value: server.${LAB_NS}.svc.cluster.local
            - name: TARGET_PORT
              value: "9000"
            - name: PROBE_INTERVAL_S
              value: "${PROBE_INTERVAL_S}"
          volumeMounts:
            - name: probes
              mountPath: /probes
      volumes:
        - name: probes
          configMap:
            name: lab-probes
---
