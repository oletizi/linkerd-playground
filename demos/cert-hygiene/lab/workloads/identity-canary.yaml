apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-canary
  namespace: ${LAB_NS}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-canary
  template:
    metadata:
      labels:
        app: identity-canary
    spec:
      containers:
        - name: idle
          image: ${IMAGE_BUSYBOX}
          command: ["sh", "-c", "while :; do sleep 3600; done"]
