apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: ${LAB_NS}
  annotations:
    config.linkerd.io/opaque-ports: "9000"
spec:
  selector:
    app: server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: echo
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: ${LAB_NS}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
      annotations:
        config.linkerd.io/opaque-ports: "9000"
    spec:
      containers:
        - name: http
          image: ${IMAGE_BUSYBOX}
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
        - name: echo
          image: ${IMAGE_SOCAT}
          args: ["TCP-LISTEN:9000,fork,reuseaddr", "EXEC:cat"]
          ports:
            - containerPort: 9000
